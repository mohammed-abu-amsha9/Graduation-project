
<!DOCTYPE html>
<html lang="ar" dir="rtl" style="height:100%">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عيادة طبية - تسجيل الدخول</title>
<link rel="stylesheet" href="../public/css/style.css">
</head>
<body>

  <!-- Decorative Circles -->
  <div class="circle-tl"></div>
  <div class="circle-br"></div>

  <!-- Dot Grids -->
  <div class="dots dots-left">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div class="dots dots-right">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <!-- Logo -->
  <div class="logo-wrap">
    <div class="logo-icon">
      <!-- Stethoscope SVG -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="38" height="38">
        <circle cx="22" cy="12" r="5" stroke="#4a8de8" stroke-width="3" fill="none"/>
        <circle cx="22" cy="12" r="2" fill="#4a8de8"/>
        <path d="M14 20 Q10 28 10 34 Q10 46 22 46 Q34 46 34 34 Q34 28 30 20" stroke="#4a8de8" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M34 34 Q34 50 44 52" stroke="#4a8de8" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="44" cy="54" r="4" fill="#4a8de8"/>
        <circle cx="44" cy="54" r="6" stroke="#4a8de8" stroke-width="2" fill="none"/>
      </svg>
    </div>
    <h1 class="logo-title">عيادة طبية</h1>
    <p class="logo-sub">نظام إدارة العيادات الطبية</p>
  </div>

  <!-- Login Card -->
  <div class="card">
    <h2 class="card-title">تسجيل الدخول</h2>

    <!-- Email -->
    <div class="field-group">
      <label class="field-label">البريد الإلكتروني</label>
      <div class="input-wrap no-toggle">
        <span class="icon-left">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </span>
        <input type="email" placeholder="أدخل البريد الإلكتروني" />
      </div>
    </div>

    <!-- Password -->
    <div class="field-group">
      <label class="field-label">كلمة المرور</label>
      <div class="input-wrap">
        <span class="icon-left">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </span>
        <button class="toggle-pass" type="button" onclick="togglePassword()" aria-label="إظهار/إخفاء كلمة المرور">
          <svg id="eye-off" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
          </svg>
          <svg id="eye-on" class="hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
        <input id="password" type="password" placeholder="أدخل كلمة المرور" />
      </div>
    </div>

    <!-- Options Row -->
    <div class="row-opts">
      <label class="remember">
        <span>تذكرني</span>
        <input type="checkbox" />
      </label>
      <a href="#" class="forgot">نسيت كلمة المرور؟</a>
    </div>

    <!-- Submit -->
    <button class="btn-login" type="button">تسجيل الدخول</button>
  </div>

  <!-- Footer -->
  <p class="footer">جميع الحقوق محفوظة © 2025</p>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const eyeOff = document.getElementById('eye-off');
      const eyeOn = document.getElementById('eye-on');
      if (input.type === 'password') {
        input.type = 'text';
        eyeOff.classList.add('hidden');
        eyeOn.classList.remove('hidden');
      } else {
        input.type = 'password';
        eyeOff.classList.remove('hidden');
        eyeOn.classList.add('hidden');
      }
    }
  </script>

</body>
</html>
